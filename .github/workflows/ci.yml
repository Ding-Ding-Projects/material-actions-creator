name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test

  linux:
    name: Linux launcher, self-test and browser check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint the launcher
        run: shellcheck scripts/run-linux.sh extension-samples/hello-shell/main.sh
      - name: Self-test (installs dependencies itself)
        run: scripts/run-linux.sh --self-test
      - name: systemd user service starts, answers and is removed
        run: |
          unit="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user/material-actions-creator.service"
          code=0
          scripts/run-linux.sh --install-service --port 8123 || code=$?
          grep -q 'Environment=PORT=8123' "$unit"
          if [ "$code" -eq 0 ]; then
            for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:8123/api/health && break; sleep 0.2; done
            curl -fsS http://127.0.0.1:8123/api/extensions | grep -q '"workflow-lint"'
            systemctl --user is-active material-actions-creator.service
          elif [ "$code" -eq 3 ]; then
            echo "::notice::No systemd user manager on this runner; only the unit file was checked."
          else
            exit "$code"
          fi
          scripts/run-linux.sh --uninstall-service
          test ! -e "$unit"
          if curl -fsS http://127.0.0.1:8123/api/health; then echo "service still answering"; exit 1; fi
      - name: Menu entry is written
        run: |
          scripts/run-linux.sh --install-desktop
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/applications/material-actions-creator.desktop"
      - name: Browser check in headless Chrome
        run: node scripts/browser-check.mjs --shots shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-screenshots
          path: shots
          if-no-files-found: ignore

  lint-workflows:
    name: Lint repo + generated workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Render sample build workflows
        run: npm run render-workflow -- rendered
      - name: Lint this repository's workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Lint generated workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color rendered/amd64.yml rendered/arm64-args.yml rendered/docker-encrypted.yml rendered/scripts-private.yml rendered/scripts-encrypted.yml rendered/source-private.yml rendered/source-encrypted-public.yml

  crypt-compat:
    name: mac-crypt skill on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make a run key
        id: key
        shell: bash
        run: |
          key=$(node src/mac-crypt.mjs keygen)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Fake source repository with a build script
        shell: bash
        run: |
          mkdir -p fake/owner-repo-abc123/build
          printf '@echo off\r\nmkdir dist\\sub 2>nul\r\necho installer for %%COMPUTERNAME%%> dist\\Setup-1.0.exe\r\necho msi> dist\\sub\\App.msi\r\n' > fake/owner-repo-abc123/build/installer.bat
          printf '#!/usr/bin/env bash\nmkdir -p dist/sub\necho installer > dist/Setup-1.0.exe\necho msi > dist/sub/App.msi\n' > fake/owner-repo-abc123/build/installer.sh
          tar -czf src.tar.gz -C fake owner-repo-abc123
          mkdir -p bundle && mv src.tar.gz bundle/
      - name: Seal sources (what the app does before upload)
        uses: ./.github/actions/mac-crypt
        with:
          mode: seal
          key: ${{ steps.key.outputs.key }}
          path: bundle
          globs: src.tar.gz
          output: src.mac
      - name: Unpack sources (same commands as the generated workflow)
        shell: bash
        env:
          MAC_KEY: ${{ steps.key.outputs.key }}
        run: |
          rm -rf bundle fake
          node src/mac-crypt.mjs open src.mac .mac-src
          mv .mac-src/src.tar.gz src.tar.gz
          mkdir -p src
          tar -xzf src.tar.gz --strip-components=1 -C src
          rm -f src.tar.gz
      - name: Run the .bat build script
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: src
        env:
          SCRIPT: "build\\installer.bat"
        run: call "%SCRIPT%"
      - name: Run the .sh build script
        if: runner.os != 'Windows'
        shell: bash
        working-directory: src
        env:
          SCRIPT: "build/installer.sh"
        run: bash "./$SCRIPT"
      - name: Seal outputs with the composite action
        uses: ./.github/actions/mac-crypt
        with:
          mode: seal
          key: ${{ steps.key.outputs.key }}
          path: src
          globs: "dist/**/*.exe, dist/**/*.msi"
          output: out.mac
      - name: Open outputs (what the app does after download)
        uses: ./.github/actions/mac-crypt
        with:
          mode: open
          key: ${{ steps.key.outputs.key }}
          input: out.mac
          path: back
      - name: Verify round trip
        shell: bash
        run: |
          test -s back/dist/Setup-1.0.exe
          test -s back/dist/sub/App.msi
          cmp src/dist/Setup-1.0.exe back/dist/Setup-1.0.exe
          if grep -a -q "installer" out.mac; then echo "plaintext leaked into out.mac"; exit 1; fi
          echo "mac-crypt OK on $RUNNER_OS"
      - name: Wrong key must fail
        shell: bash
        run: |
          if MAC_KEY=$(node src/mac-crypt.mjs keygen) node src/mac-crypt.mjs open out.mac nope; then exit 1; fi

  docker:
    name: Docker image build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: material-actions-creator:ci
          build-args: |
            MAC_COMMIT=${{ github.sha }}
            MAC_BUILT_AT=${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
      - name: GitHub CLI is bundled
        run: docker run --rm --entrypoint gh material-actions-creator:ci --version
      - name: Start container
        run: docker run -d --name mac -p 8080:8080 -e SWEEP_ON_START=false material-actions-creator:ci
      - name: Smoke test
        run: |
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "Material Actions Creator"
          curl -fsS http://localhost:8080/api/auth | tee auth.json
          grep -q '"ghAvailable":true' auth.json
          grep -q '"signedIn":false' auth.json
          curl -fsS http://localhost:8080/api/provenance | tee prov.json
          grep -q "\"commit\":\"${GITHUB_SHA:0:12}\"" prov.json
          curl -fsS http://localhost:8080/completeness.json > /dev/null
          curl -fsS http://localhost:8080/docs/index.json > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{"dockerfile":"FROM alpine"}' http://localhost:8080/api/builds)
          test "$code" = "400"
      - name: CLI is bundled
        run: |
          docker run --rm --entrypoint mac material-actions-creator:ci --version
          docker run --rm --entrypoint mac material-actions-creator:ci --help | grep -q "mac login"
          docker run --rm -e GITHUB_TOKEN= --entrypoint mac material-actions-creator:ci whoami || test $? -eq 1
      - name: Container logs
        if: always()
        run: docker logs mac || true
