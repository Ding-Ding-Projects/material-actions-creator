<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linux launcher</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4ff3a}a:hover{color:#eaff8f}
@keyframes macpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes macrise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes macflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes macorb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.18)}}
@keyframes macorb2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,50px) scale(.9)}}
.mac-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
[data-motion="on"] .mac-orb{animation:macorb 14s ease-in-out infinite}
[data-motion="on"] .mac-orb + .mac-orb{animation:macorb2 18s ease-in-out infinite}
[data-motion="on"] section,[data-motion="on"] article,[data-motion="on"] aside,[data-motion="on"] [role="dialog"]{animation:macrise .8s cubic-bezier(.2,.9,.1,1) both}
[data-motion="on"] section:nth-of-type(2),[data-motion="on"] article:nth-of-type(2),[data-motion="on"] aside{animation-delay:.12s}
[data-motion="on"] article:nth-of-type(3){animation-delay:.24s}
[data-motion="on"] button,[data-motion="on"] a,[data-motion="on"] label{transition:transform .3s cubic-bezier(.2,.9,.1,1),filter .25s,background .25s,border-color .25s,box-shadow .3s}
[data-motion="on"] button:hover,[data-motion="on"] a:hover{transform:translateY(-2px);filter:brightness(1.08)}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@keyframes macpop{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes macink{from{transform:scaleX(.15)}to{transform:none}}
@keyframes macgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes macburst{from{opacity:1;transform:rotate(var(--a)) translateY(0)}to{opacity:0;transform:rotate(var(--a)) translateY(-260px) rotate(220deg)}}
@keyframes maclevel{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(2deg)}32%{transform:none}100%{opacity:1}}
@keyframes macring{0%,100%{box-shadow:0 0 0 4px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}50%{box-shadow:0 0 0 8px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}}
@keyframes macdash{to{stroke-dashoffset:-24}}
[data-motion="on"] .mac-pop{animation:macpop .45s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ink{animation:macink .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center}
[data-motion="on"] .mac-grow{animation:macgrow 1.1s cubic-bezier(.2,.9,.1,1) both;transform-origin:left}
[data-motion="on"] .mac-burst i{animation:macburst 1.6s cubic-bezier(.2,.9,.1,1) infinite}
[data-motion="on"] .mac-level{animation:maclevel 1.2s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ring{animation:macring 1.6s ease-in-out infinite}
[data-motion="on"] .mac-dash{animation:macdash 1s linear infinite}
[data-motion="on"] li{animation:macrise .6s cubic-bezier(.2,.9,.1,1) both}
</style>
</helmet>
<div data-motion="{{motionFlag}}" style="--acc: {{accent}}; isolation: isolate; width: 1440px; height: 820px; box-sizing: border-box; background: #0b0c10; color: #eef0f6; font-family: 'Bricolage Grotesque', system-ui, sans-serif; position: relative; overflow: hidden">
<div class="mac-orb" aria-hidden="true" style="width: 560px; height: 560px; left: -180px; top: -220px; background: {{accent}}; opacity: .14"></div><div class="mac-orb" aria-hidden="true" style="width: 480px; height: 480px; right: -160px; top: 120px; background: #b69cff; opacity: .16"></div>

<div style="padding: 48px 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; height: 100%; box-sizing: border-box">
  <section style="display: grid; gap: 16px; align-content: start">
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">Linux</p>
    <h2 style="font-size: 52px; letter-spacing: -.04em; line-height: .95; margin: 0">One command.<br><span style="color: {{accent}}">Then it checks itself.</span></h2>
    <p style="color: #a7adc0; line-height: 1.5; margin: 0; max-width: 54ch">No Docker needed. The launcher checks Node and the GitHub CLI, picks data and config folders the Linux way, and can install a user service that starts with your session.</p>
    <div style="display: grid; gap: 8px"><sc-for list="{{checks}}" as="c" hint-placeholder-count="5"><div style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; border-radius: 16px; display: flex; gap: 12px; align-items: center; padding: 12px 16px; animation-delay: {{c.delay}}"><span style="width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: {{c.bg}}; color: {{c.fg}}">{{c.mark}}</span><div style="flex: 1"><strong>{{c.name}}</strong><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a8">{{c.detail}}</div></div></div></sc-for></div>
  </section>
  <section style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; border-radius: 24px; overflow: hidden; align-self: start">
    <div style="display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid #2c3140"><i style="width: 12px; height: 12px; border-radius: 50%; background: #ff7a6b"></i><i style="width: 12px; height: 12px; border-radius: 50%; background: #ffc857"></i><i style="width: 12px; height: 12px; border-radius: 50%; background: #7cf5c8"></i><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a8; margin-left: 8px">bash — material-actions-creator</span></div>
    <pre style="margin: 0; padding: 20px; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.75; color: #c9cede; white-space: pre-wrap">{{term}}<span style="display: inline-block; width: 9px; height: 17px; vertical-align: -3px; background: {{accent}}; animation: {{blink}}"></span></pre>
  </section>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#d4ff3a", "options": ["#d4ff3a", "#7cf5c8", "#b69cff", "#ff9e7a"], "section": "Look"}, "motion": {"editor": "boolean", "default": true, "section": "Look"}, "stage": {"editor": "select", "default": "ready", "options": ["ready", "missing-gh"], "section": "Stage"}, "$preview": {"width": 1440, "height": 820}}'>
class Component extends DCLogic {

  renderVals() {
    const accent = this.props.accent ?? '#d4ff3a';
    const motion = this.props.motion ?? true;
    const stage = this.props.stage ?? 'ready';
    const bad = stage === 'missing-gh';
    const rows = [
      ['Node.js 22 or newer', 'v22.23.5', true],
      ['GitHub CLI', bad ? 'not found — sign-in from the app is unavailable; GITHUB_TOKEN still works' : 'gh 2.63.0', !bad],
      ['Data folder', '~/.local/share/material-actions-creator', true],
      ['Extensions run', '3 built-in · sh and python3 samples', true],
      ['Port', '8080 is free', true],
    ];
    const checks = rows.map(([name, detail, ok], i) => ({ name, detail, mark: ok ? '✓' : '!', bg: ok ? 'rgba(124,245,200,.18)' : 'rgba(255,200,87,.2)', fg: ok ? '#7cf5c8' : '#ffc857', delay: i * 70 + 'ms' }));
    const term = '$ ./scripts/run-linux.sh\n' + rows.map(([n, d, ok]) => (ok ? '  ok    ' : '  warn  ') + n + '  ' + d).join('\n') + '\n\n  Material Actions Creator 0.5.0\n  http://localhost:8080\n\n$ ./scripts/run-linux.sh --install-service\n  wrote ~/.config/systemd/user/material-actions-creator.service\n  started. Logs: journalctl --user -u material-actions-creator\n$ ';
    return { accent, motionFlag: motion ? 'on' : 'off', checks, term, blink: motion ? 'macpulse 1s steps(1) infinite' : 'none' };
  }
}
</script>
</body>
</html>
