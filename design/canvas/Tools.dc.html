<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tools</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4ff3a}a:hover{color:#eaff8f}
@keyframes macpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes macrise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes macflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes macorb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.18)}}
@keyframes macorb2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,50px) scale(.9)}}
.mac-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
[data-motion="on"] .mac-orb{animation:macorb 14s ease-in-out infinite}
[data-motion="on"] .mac-orb + .mac-orb{animation:macorb2 18s ease-in-out infinite}
[data-motion="on"] section,[data-motion="on"] article,[data-motion="on"] aside,[data-motion="on"] [role="dialog"]{animation:macrise .8s cubic-bezier(.2,.9,.1,1) both}
[data-motion="on"] section:nth-of-type(2),[data-motion="on"] article:nth-of-type(2),[data-motion="on"] aside{animation-delay:.12s}
[data-motion="on"] article:nth-of-type(3){animation-delay:.24s}
[data-motion="on"] button,[data-motion="on"] a,[data-motion="on"] label{transition:transform .3s cubic-bezier(.2,.9,.1,1),filter .25s,background .25s,border-color .25s,box-shadow .3s}
[data-motion="on"] button:hover,[data-motion="on"] a:hover{transform:translateY(-2px);filter:brightness(1.08)}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@keyframes macpop{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes macink{from{transform:scaleX(.15)}to{transform:none}}
@keyframes macgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes macburst{from{opacity:1;transform:rotate(var(--a)) translateY(0)}to{opacity:0;transform:rotate(var(--a)) translateY(-260px) rotate(220deg)}}
@keyframes maclevel{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(2deg)}32%{transform:none}100%{opacity:1}}
@keyframes macring{0%,100%{box-shadow:0 0 0 4px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}50%{box-shadow:0 0 0 8px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}}
@keyframes macdash{to{stroke-dashoffset:-24}}
[data-motion="on"] .mac-pop{animation:macpop .45s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ink{animation:macink .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center}
[data-motion="on"] .mac-grow{animation:macgrow 1.1s cubic-bezier(.2,.9,.1,1) both;transform-origin:left}
[data-motion="on"] .mac-burst i{animation:macburst 1.6s cubic-bezier(.2,.9,.1,1) infinite}
[data-motion="on"] .mac-level{animation:maclevel 1.2s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ring{animation:macring 1.6s ease-in-out infinite}
[data-motion="on"] .mac-dash{animation:macdash 1s linear infinite}
[data-motion="on"] li{animation:macrise .6s cubic-bezier(.2,.9,.1,1) both}
</style>
</helmet>
<div data-motion="{{motionFlag}}" style="--acc: {{accent}}; isolation: isolate; width: 1440px; height: 780px; box-sizing: border-box; background: #0b0c10; color: #eef0f6; font-family: 'Bricolage Grotesque', system-ui, sans-serif; position: relative; overflow: hidden">
<div class="mac-orb" aria-hidden="true" style="width: 560px; height: 560px; left: -180px; top: -220px; background: {{accent}}; opacity: .14"></div><div class="mac-orb" aria-hidden="true" style="width: 480px; height: 480px; right: -160px; top: 120px; background: #b69cff; opacity: .16"></div>

<div style="padding: 48px 56px; height: 100%; box-sizing: border-box; display: grid; grid-template-rows: auto auto 1fr; gap: 18px">
  <div><p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">Tools · everything stays in this browser</p><h2 style="font-size: 48px; letter-spacing: -.04em; line-height: .95; margin: 0">Small tools, <span style="color: {{accent}}">zero uploads.</span></h2></div>
  <div role="tablist" style="display: flex; gap: 4px; padding: 4px; border: 1px solid #2c3140; border-radius: 16px; width: fit-content"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: {{t.bg}}; color: {{t.color}}; font: 700 14px 'Bricolage Grotesque', sans-serif">{{t.label}}</button></sc-for></div>
  <div class="mac-pop" style="display: grid; grid-template-columns: 1fr 64px 1fr; gap: 14px; align-items: stretch; min-height: 0">
    <section style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 18px; display: grid; grid-template-rows: auto 1fr; gap: 10px"><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a8">{{inLabel}}</div><pre style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: #c9cede; white-space: pre-wrap">{{input}}</pre></section>
    <div style="display: grid; place-items: center"><svg width="56" height="24" viewBox="0 0 56 24" aria-hidden="true"><path class="mac-dash" d="M2 12h46" stroke="{{accent}}" stroke-width="2.5" stroke-dasharray="6 6" fill="none"/><path d="m44 5 8 7-8 7" stroke="{{accent}}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <section style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 18px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; border-color: {{accent}}"><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{accent}}">{{outLabel}}</div><pre style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7; color: #eef0f6; white-space: pre-wrap; overflow-wrap: anywhere">{{output}}</pre><div style="font-size: 13px; color: #ffc857">{{note}}</div></section>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#d4ff3a", "options": ["#d4ff3a", "#7cf5c8", "#b69cff", "#ff9e7a"], "section": "Look"}, "motion": {"editor": "boolean", "default": true, "section": "Look"}, "tool": {"editor": "select", "section": "Stage", "default": "base64", "options": ["base64", "convert", "jsonstudio"]}, "$preview": {"width": 1440, "height": 780}}'>
class Component extends DCLogic {

  constructor(p) { super(p); this.state = { tool: null }; }
  renderVals() {
    const accent = this.props.accent ?? '#d4ff3a';
    const motion = this.props.motion ?? true;
    const tool = this.state.tool ?? (this.props.tool ?? 'base64');
    const T = { base64: ['Base64', 'TEXT · 5 bytes', 'hello', 'BASE64 · URL-safe off', 'aGVsbG8=', ''],
      convert: ['Converter', 'JSON', '[\n  { "name": "Setup.exe", "meta": { "mb": 48 } },\n  { "name": "app.nupkg", "meta": { "mb": 47 } }\n]', 'CSV', 'name,meta.mb\nSetup.exe,48\napp.nupkg,47', 'Nested values were flattened into dotted columns.'],
      jsonstudio: ['JSON studio', 'JSON SAMPLE', '{\n  "id": 7,\n  "name": "Setup.exe",\n  "tags": ["win", "x64"]\n}', 'TYPESCRIPT · built-in generator', 'export interface Root {\n  id: number;\n  name: string;\n  tags: string[];\n}', 'Built-in generator in the style of quicktype, not the quicktype library.'] };
    const tabs = Object.entries(T).map(([id, v]) => ({ label: v[0], on: id === tool ? 'true' : 'false', bg: id === tool ? accent : 'transparent', color: id === tool ? '#141a00' : '#8d93a8', pick: () => this.setState({ tool: id }) }));
    const [, inLabel, input, outLabel, output, note] = T[tool];
    return { accent, motionFlag: motion ? 'on' : 'off', tabs, inLabel, input, outLabel, output, note };
  }
}
</script>
</body>
</html>
