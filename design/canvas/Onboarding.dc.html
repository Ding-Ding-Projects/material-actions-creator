<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup wizard and tour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4ff3a}a:hover{color:#eaff8f}
@keyframes macpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes macrise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes macflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes macorb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.18)}}
@keyframes macorb2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,50px) scale(.9)}}
.mac-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
[data-motion="on"] .mac-orb{animation:macorb 14s ease-in-out infinite}
[data-motion="on"] .mac-orb + .mac-orb{animation:macorb2 18s ease-in-out infinite}
[data-motion="on"] section,[data-motion="on"] article,[data-motion="on"] aside,[data-motion="on"] [role="dialog"]{animation:macrise .8s cubic-bezier(.2,.9,.1,1) both}
[data-motion="on"] section:nth-of-type(2),[data-motion="on"] article:nth-of-type(2),[data-motion="on"] aside{animation-delay:.12s}
[data-motion="on"] article:nth-of-type(3){animation-delay:.24s}
[data-motion="on"] button,[data-motion="on"] a,[data-motion="on"] label{transition:transform .3s cubic-bezier(.2,.9,.1,1),filter .25s,background .25s,border-color .25s,box-shadow .3s}
[data-motion="on"] button:hover,[data-motion="on"] a:hover{transform:translateY(-2px);filter:brightness(1.08)}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@keyframes macpop{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes macink{from{transform:scaleX(.15)}to{transform:none}}
@keyframes macgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes macburst{from{opacity:1;transform:rotate(var(--a)) translateY(0)}to{opacity:0;transform:rotate(var(--a)) translateY(-260px) rotate(220deg)}}
@keyframes maclevel{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(2deg)}32%{transform:none}100%{opacity:1}}
@keyframes macring{0%,100%{box-shadow:0 0 0 4px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}50%{box-shadow:0 0 0 8px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}}
@keyframes macdash{to{stroke-dashoffset:-24}}
[data-motion="on"] .mac-pop{animation:macpop .45s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ink{animation:macink .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center}
[data-motion="on"] .mac-grow{animation:macgrow 1.1s cubic-bezier(.2,.9,.1,1) both;transform-origin:left}
[data-motion="on"] .mac-burst i{animation:macburst 1.6s cubic-bezier(.2,.9,.1,1) infinite}
[data-motion="on"] .mac-level{animation:maclevel 1.2s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ring{animation:macring 1.6s ease-in-out infinite}
[data-motion="on"] .mac-dash{animation:macdash 1s linear infinite}
[data-motion="on"] li{animation:macrise .6s cubic-bezier(.2,.9,.1,1) both}
</style>
</helmet>
<div data-motion="{{motionFlag}}" style="--acc: {{accent}}; isolation: isolate; width: 1440px; height: 820px; box-sizing: border-box; background: #0b0c10; color: #eef0f6; font-family: 'Bricolage Grotesque', system-ui, sans-serif; position: relative; overflow: hidden">
<div class="mac-orb" aria-hidden="true" style="width: 560px; height: 560px; left: -180px; top: -220px; background: {{accent}}; opacity: .14"></div><div class="mac-orb" aria-hidden="true" style="width: 480px; height: 480px; right: -160px; top: 120px; background: #b69cff; opacity: .16"></div>

<div style="display: grid; grid-template-columns: 620px 1fr; gap: 48px; padding: 56px; height: 100%; box-sizing: border-box">
  <div role="dialog" aria-label="Setup" class="mac-pop" style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; border-radius: 32px; padding: 32px; align-self: start; box-shadow: 0 40px 120px rgba(0,0,0,.55)">
    <div style="display: flex; gap: 6px; margin-bottom: 18px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="5"><i class="mac-grow" style="flex: 1; height: 6px; border-radius: 6px; background: {{b.bg}}"></i></sc-for></div>
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">Step {{n}} of 5</p>
    <h2 style="font-size: 34px; letter-spacing: -.02em; margin: 0 0 8px">{{title}}</h2>
    <p style="color: #a7adc0; font-size: 16px; line-height: 1.5; margin: 0 0 20px">{{body}}</p>
    <div style="display: grid; gap: 10px; margin-bottom: 24px"><sc-for list="{{choices}}" as="c" hint-placeholder-count="3"><div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; border: 1px solid {{c.border}}; background: {{c.bg}}"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{c.dot}}"></span>{{c.label}}<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a8">{{c.hint}}</span></div></sc-for></div>
    <div style="display: flex; gap: 10px; align-items: center">
      <button type="button" onClick="{{back}}" style="min-height: 48px; padding: 0 18px; border: 1px solid #2c3140; border-radius: 14px; background: #191c25; color: #eef0f6; font: 600 15px 'Bricolage Grotesque', sans-serif; opacity: {{backOpacity}}">Back</button>
      <span style="flex: 1"></span>
      <button type="button" style="min-height: 48px; padding: 0 16px; border: 0; background: none; color: #8d93a8; font: 600 15px 'Bricolage Grotesque', sans-serif; display: {{skipDisplay}}">Skip this step</button>
      <button type="button" onClick="{{next}}" style="min-height: 52px; padding: 0 26px; border: 0; border-radius: 22px; background: {{accent}}; color: #141a00; font: 800 17px 'Bricolage Grotesque', sans-serif; box-shadow: 0 14px 40px -12px {{accent}}">{{nextLabel}}</button>
    </div>
  </div>
  <div style="position: relative">
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">Then: Take a tour</p>
    <div style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 14px 18px; display: flex; gap: 10px; align-items: center; margin-top: 40px">
      <span class="mac-ring" style="padding: 10px 14px; border-radius: 14px; background: #232733">◉ Runs</span><span style="padding: 10px 14px; color: #8d93a8">❏ Docs</span><span style="padding: 10px 14px; color: #8d93a8">↺ History</span>
    </div>
    <div class="mac-pop" style="position: absolute; top: 160px; left: 20px; width: 340px; background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.6)">
      <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">Step 3 of 5</p>
      <p style="margin: 0 0 16px; line-height: 1.5">Runs: live progress, outputs to download, and builds that survive restarts.</p>
      <div style="display: flex; gap: 8px; align-items: center"><span style="color: #8d93a8; font-size: 14px">Back · Skip this step</span><span style="flex: 1"></span><span style="padding: 10px 18px; border-radius: 16px; background: {{accent}}; color: #141a00; font-weight: 800">Next</span></div>
    </div>
    <svg width="200" height="120" viewBox="0 0 200 120" aria-hidden="true" style="position: absolute; top: 96px; left: 120px"><path class="mac-dash" d="M10 10 C 60 10, 80 60, 60 70" fill="none" stroke="{{accent}}" stroke-width="2" stroke-dasharray="6 6"/></svg>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#d4ff3a", "options": ["#d4ff3a", "#7cf5c8", "#b69cff", "#ff9e7a"], "section": "Look"}, "motion": {"editor": "boolean", "default": true, "section": "Look"}, "step": {"editor": "select", "default": "2", "options": ["1", "2", "3", "4", "5"], "section": "Stage"}, "$preview": {"width": 1440, "height": 820}}'>
class Component extends DCLogic {

  constructor(p) { super(p); this.state = { step: null }; }
  renderVals() {
    const accent = this.props.accent ?? '#d4ff3a';
    const motion = this.props.motion ?? true;
    const step = this.state.step ?? Number(this.props.step ?? 2);
    const S = [
      ['Pick your language and voice', 'Funny levels change the voice, never the facts.', [['English', 'funny 5'], ['Cantonese', 'funny 5'], ['Bilingual', '']], 0],
      ['Connect GitHub', 'Checks the sign-in and the scopes temporary repositories need.', [['Signed in as octocat', 'repo · workflow'], ['Missing: delete_repo', 'fix'], ['Sign in with GitHub CLI', 'device code']], 1],
      ['Where should builds run?', 'The default for new builds. Each build can still choose.', [['Private temp repo', 'private minutes'], ['Encrypted public builder', 'ciphertext only'], ['', '']], 1],
      ['Personal wording (optional)', 'Upload or drop a vocabulary JSON. It never leaves this browser.', [['Upload vocabulary JSON', '.json'], ['Or drop it anywhere on the window', ''], ['', '']], 0],
      ['Ready', 'Everything is set. The tour shows you around in under a minute.', [['Language: English', ''], ['Default mode: encrypted public', ''], ['Personal wording: applied', '']], -1],
    ][step - 1];
    const choices = S[2].filter((c) => c[0]).map(([label, hint], i) => ({ label, hint, border: i === S[3] ? accent : '#2c3140', bg: i === S[3] ? 'rgba(212,255,58,.06)' : '#191c25', dot: i === S[3] ? accent : '#2c3140' }));
    const bars = [1, 2, 3, 4, 5].map((i) => ({ bg: i <= step ? accent : '#232733' }));
    return { accent, motionFlag: motion ? 'on' : 'off', n: step, title: S[0], body: S[1], choices, bars,
      backOpacity: step === 1 ? .4 : 1, skipDisplay: step === 2 || step === 4 ? 'inline-block' : 'none', nextLabel: step === 5 ? 'Finish' : 'Next',
      back: () => this.setState({ step: Math.max(1, step - 1) }), next: () => this.setState({ step: step === 5 ? 1 : step + 1 }) };
  }
}
</script>
</body>
</html>
