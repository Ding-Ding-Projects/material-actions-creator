<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub CLI sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4ff3a}a:hover{color:#eaff8f}
@keyframes macpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes macrise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes macflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes macorb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.18)}}
@keyframes macorb2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,50px) scale(.9)}}
.mac-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
[data-motion="on"] .mac-orb{animation:macorb 14s ease-in-out infinite}
[data-motion="on"] .mac-orb + .mac-orb{animation:macorb2 18s ease-in-out infinite}
[data-motion="on"] section,[data-motion="on"] article,[data-motion="on"] aside,[data-motion="on"] [role="dialog"]{animation:macrise .8s cubic-bezier(.2,.9,.1,1) both}
[data-motion="on"] section:nth-of-type(2),[data-motion="on"] article:nth-of-type(2),[data-motion="on"] aside{animation-delay:.12s}
[data-motion="on"] article:nth-of-type(3){animation-delay:.24s}
[data-motion="on"] button,[data-motion="on"] a,[data-motion="on"] label{transition:transform .3s cubic-bezier(.2,.9,.1,1),filter .25s,background .25s,border-color .25s,box-shadow .3s}
[data-motion="on"] button:hover,[data-motion="on"] a:hover{transform:translateY(-2px);filter:brightness(1.08)}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div data-motion="{{motionFlag}}" style="isolation: isolate; width: 560px; height: 560px; box-sizing: border-box; padding: 24px; background: #08090c; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: #eef0f6; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden">
<div class="mac-orb" aria-hidden="true" style="width: 520px; height: 520px; left: -160px; top: -200px; background: {{accent}}; opacity: .16"></div><div class="mac-orb" aria-hidden="true" style="width: 460px; height: 460px; right: -140px; top: 80px; background: #b69cff; opacity: .18"></div>
  <div role="dialog" aria-labelledby="t" style="position: relative; width: 100%; box-sizing: border-box; background: #12141b; border: 1px solid #2c3140; border-radius: 32px; padding: 32px; box-shadow: 0 40px 120px rgba(0,0,0,.6)">
    <button type="button" aria-label="Close" style="position: absolute; top: 16px; right: 16px; border: 0; width: 44px; height: 44px; border-radius: 50%; background: #232733; color: #eef0f6; font-size: 20px">×</button>
    <p style="font: 12px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">GitHub CLI</p>
    <h2 id="t" style="font-size: 40px; letter-spacing: -.035em; margin: 0 0 12px; font-weight: 800">Sign in</h2>
    <p style="color: #a7adc0; margin: 0; font-size: 16px; line-height: 1.45">Open GitHub, paste this one-time code, and approve the scopes below.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0">
      <span style="font: 600 12px 'JetBrains Mono', monospace; padding: 6px 10px; border-radius: 99px; background: rgba(124,245,200,.12); color: #7cf5c8">repo</span>
      <span style="font: 600 12px 'JetBrains Mono', monospace; padding: 6px 10px; border-radius: 99px; background: rgba(124,245,200,.12); color: #7cf5c8">workflow</span>
      <span style="font: 600 12px 'JetBrains Mono', monospace; padding: 6px 10px; border-radius: 99px; background: rgba(124,245,200,.12); color: #7cf5c8">delete_repo</span>
      <span style="font: 600 12px 'JetBrains Mono', monospace; padding: 6px 10px; border-radius: 99px; background: #232733; color: #a7adc0">read:org</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-radius: 22px; background: #0b0c10; border: 1px solid {{accent}}">
      <strong style="font: 700 38px 'JetBrains Mono', monospace; letter-spacing: .08em; color: {{accent}}">7F3K-Q9XD</strong>
      <button type="button" style="border: 1px solid #2c3140; background: #191c25; color: #eef0f6; padding: 12px 16px; border-radius: 14px; font: inherit; font-weight: 600; font-size: 14px">Copy</button>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px">
      <a href="#" style="background: {{accent}}; color: #141a00; padding: 14px 20px; border-radius: 20px; font-weight: 800; text-decoration: none; font-size: 15px">Open github.com/login/device ↗</a>
      <a href="#" style="border: 1px solid #2c3140; color: #eef0f6; padding: 14px 18px; border-radius: 20px; font-weight: 600; text-decoration: none; font-size: 15px">Cancel</a>
    </div>
    <p style="display: flex; align-items: center; gap: 8px; color: #a7adc0; font-size: 14px; margin: 18px 0 0">
      <i style="width: 8px; height: 8px; border-radius: 50%; background: #b69cff; animation: {{motionAnim}}"></i><i style="width: 8px; height: 8px; border-radius: 50%; background: #b69cff; opacity: .6"></i><i style="width: 8px; height: 8px; border-radius: 50%; background: #b69cff; opacity: .3"></i>
      Waiting for GitHub to confirm…
    </p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#d4ff3a", "options": ["#d4ff3a", "#7cf5c8", "#b69cff", "#ff9e7a"], "section": "Look"}, "motion": {"editor": "boolean", "default": true, "section": "Look"}, "$preview": {"width": 560, "height": 560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#d4ff3a';
    const motion = this.props.motion ?? true;
    const motionAnim = motion ? 'macpulse 1.4s ease-in-out infinite' : 'none';
    const motionFlag = motion ? 'on' : 'off';
    const flow = motion ? 'macflow 1.6s linear infinite' : 'none'; return { accent, motionAnim, motionFlag }; }
}
</script>
</body>
</html>
