<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Run on this computer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4ff3a}a:hover{color:#eaff8f}
@keyframes macpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes macrise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes macflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes macorb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.18)}}
@keyframes macorb2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,50px) scale(.9)}}
.mac-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
[data-motion="on"] .mac-orb{animation:macorb 14s ease-in-out infinite}
[data-motion="on"] .mac-orb + .mac-orb{animation:macorb2 18s ease-in-out infinite}
[data-motion="on"] section,[data-motion="on"] article,[data-motion="on"] aside,[data-motion="on"] [role="dialog"]{animation:macrise .8s cubic-bezier(.2,.9,.1,1) both}
[data-motion="on"] section:nth-of-type(2),[data-motion="on"] article:nth-of-type(2),[data-motion="on"] aside{animation-delay:.12s}
[data-motion="on"] article:nth-of-type(3){animation-delay:.24s}
[data-motion="on"] button,[data-motion="on"] a,[data-motion="on"] label{transition:transform .3s cubic-bezier(.2,.9,.1,1),filter .25s,background .25s,border-color .25s,box-shadow .3s}
[data-motion="on"] button:hover,[data-motion="on"] a:hover{transform:translateY(-2px);filter:brightness(1.08)}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@keyframes macpop{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes macink{from{transform:scaleX(.15)}to{transform:none}}
@keyframes macgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes macburst{from{opacity:1;transform:rotate(var(--a)) translateY(0)}to{opacity:0;transform:rotate(var(--a)) translateY(-260px) rotate(220deg)}}
@keyframes maclevel{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(2deg)}32%{transform:none}100%{opacity:1}}
@keyframes macring{0%,100%{box-shadow:0 0 0 4px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}50%{box-shadow:0 0 0 8px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}}
@keyframes macdash{to{stroke-dashoffset:-24}}
[data-motion="on"] .mac-pop{animation:macpop .45s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ink{animation:macink .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center}
[data-motion="on"] .mac-grow{animation:macgrow 1.1s cubic-bezier(.2,.9,.1,1) both;transform-origin:left}
[data-motion="on"] .mac-burst i{animation:macburst 1.6s cubic-bezier(.2,.9,.1,1) infinite}
[data-motion="on"] .mac-level{animation:maclevel 1.2s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ring{animation:macring 1.6s ease-in-out infinite}
[data-motion="on"] .mac-dash{animation:macdash 1s linear infinite}
[data-motion="on"] li{animation:macrise .6s cubic-bezier(.2,.9,.1,1) both}
</style>
</helmet>
<div data-motion="{{motionFlag}}" style="--acc: {{accent}}; isolation: isolate; width: 1440px; height: 880px; box-sizing: border-box; background: #0b0c10; color: #eef0f6; font-family: 'Bricolage Grotesque', system-ui, sans-serif; position: relative; overflow: hidden">
<div class="mac-orb" aria-hidden="true" style="width: 560px; height: 560px; left: -180px; top: -220px; background: {{accent}}; opacity: .14"></div><div class="mac-orb" aria-hidden="true" style="width: 480px; height: 480px; right: -160px; top: 120px; background: #b69cff; opacity: .16"></div>

<div style="padding: 48px 56px; display: grid; grid-template-columns: 1fr 1.05fr; gap: 32px; height: 100%; box-sizing: border-box">
  <section style="display: grid; gap: 14px; align-content: start">
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">Where should it run?</p>
    <h2 style="font-size: 50px; letter-spacing: -.04em; line-height: .95; margin: 0">On this computer. <span style="color: {{accent}}">One click.</span></h2>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px"><sc-for list="{{modes}}" as="m" hint-placeholder-count="3"><div style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 14px; border-color: {{m.border}}; background: {{m.bg}}"><div style="font-weight: 800">{{m.title}}</div><div style="font-size: 12.5px; color: #a7adc0; margin-top: 4px; line-height: 1.4">{{m.body}}</div></div></sc-for></div>
    <div style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 16px 18px; display: grid; gap: 10px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a8">WHAT THIS COMPUTER CAN RUN</div>
      <sc-for list="{{caps}}" as="c" hint-placeholder-count="4"><div style="display: flex; gap: 12px; align-items: center; animation-delay: {{c.delay}}"><span style="width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: {{c.bg}}; color: {{c.fg}}">{{c.mark}}</span><div style="flex: 1"><strong>{{c.name}}</strong><div style="font-size: 13px; color: #8d93a8">{{c.detail}}</div></div></div></sc-for>
      <div style="height: 8px; border-radius: 8px; background: #232733; overflow: hidden; display: {{barDisplay}}"><i class="mac-grow" style="display: block; height: 100%; width: 62%; background: {{accent}}"></i></div>
    </div>
    <button type="button" onClick="{{go}}" style="min-height: 60px; border: 0; border-radius: 24px; background: {{accent}}; color: #141a00; font: 800 20px 'Bricolage Grotesque', sans-serif; box-shadow: 0 18px 50px -14px {{accent}}">{{cta}}</button>
    <p style="margin: 0; font-size: 13px; color: #ffc857; line-height: 1.5">{{warn}}</p>
  </section>
  <section style="display: grid; gap: 12px; align-content: start">
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">This run · nothing leaves this computer</p>
    <sc-for list="{{jobs}}" as="j" hint-placeholder-count="3"><div style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-color: {{j.border}}"><i style="width: 10px; height: 10px; border-radius: 50%; background: {{j.dot}}"></i><div style="flex: 1"><strong>{{j.name}}</strong> <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a8">{{j.on}}</span><div style="font-size: 13px; color: {{j.color}}">{{j.state}}</div></div></div></sc-for>
    <pre style="margin: 0; padding: 16px; border-radius: 16px; background: #0b0c10; border: 1px solid #2c3140; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #c9cede; white-space: pre-wrap">{{log}}<span style="display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: {{accent}}; animation: {{blink}}"></span></pre>
  </section>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#d4ff3a", "options": ["#d4ff3a", "#7cf5c8", "#b69cff", "#ff9e7a"], "section": "Look"}, "motion": {"editor": "boolean", "default": true, "section": "Look"}, "stage": {"editor": "select", "section": "Stage", "default": "running", "options": ["ready", "installing", "running", "no-containers"]}, "$preview": {"width": 1440, "height": 880}}'>
class Component extends DCLogic {

  constructor(p) { super(p); this.state = { stage: null }; }
  renderVals() {
    const accent = this.props.accent ?? '#d4ff3a';
    const motion = this.props.motion ?? true;
    const stage = this.state.stage ?? (this.props.stage ?? 'running');
    const host = stage === 'no-containers';
    const modes = [['Private temp repo', 'GitHub runs it in a private repository.'], ['Encrypted public', 'GitHub runs it; only ciphertext is public.'], ['This computer', 'Runs here. No repository, no minutes, no upload.']].map(([title, body], i) => ({ title, body, border: i === 2 ? accent : '#2c3140', bg: i === 2 ? 'rgba(212,255,58,.06)' : '#12141b' }));
    const C = [
      ['Runner program', stage === 'installing' ? 'downloading act v0.2.98 · checking its SHA-256…' : 'act v0.2.98 · installed automatically, hash checked', stage === 'installing' ? '…' : '✓', stage !== 'installing'],
      ['Containers', host ? 'none found — Linux jobs run directly on this computer instead' : 'Docker 27.3 · each job gets a clean container', host ? '!' : '✓', !host],
      ['Linux jobs', host ? 'yes, with the tools this computer has' : 'yes', '✓', true],
      ['Windows and macOS jobs', 'only on a Windows computer or a Mac — skipped here and listed', '–', null],
    ];
    const caps = C.map(([name, detail, mark, ok], i) => ({ name, detail, mark, delay: i * 70 + 'ms', bg: ok === true ? 'rgba(124,245,200,.18)' : ok === false ? 'rgba(255,200,87,.2)' : '#232733', fg: ok === true ? '#7cf5c8' : ok === false ? '#ffc857' : '#8d93a8' }));
    const run = stage === 'running';
    const J = [['build', 'ubuntu-latest', host ? 'running on this computer · step 3 of 6' : 'running in a container · step 3 of 6', accent, '#c9cede'], ['test', 'ubuntu-latest', 'waiting for build', '#8d93a8', '#8d93a8'], ['package-windows', 'windows-latest', 'Skipped: needs a Windows computer', '#ffc857', '#ffc857']];
    const jobs = (run || host ? J : J.map((j) => [j[0], j[1], 'not started', '#2c3140', '#8d93a8'])).map(([name, on, state, dot, color]) => ({ name, on, state, dot, color, border: dot === '#ffc857' ? '#ffc857' : '#2c3140' }));
    const log = run || host ? '▸ build / Set up job\n▸ build / actions/checkout@v4\n▸ build / Run ./build.sh\n  compiling 212 files\n  packaging dist/app.tar.gz\n' : stage === 'installing' ? '  getting the runner program (11.8 MB of 19 MB)\n' : '  ready when you are\n';
    return { accent, motionFlag: motion ? 'on' : 'off', modes, caps, jobs, log, blink: motion ? 'macpulse 1s steps(1) infinite' : 'none',
      barDisplay: stage === 'installing' ? 'block' : 'none', cta: stage === 'ready' ? 'Run on this computer' : stage === 'installing' ? 'Getting the runner…' : 'Running…',
      warn: host ? 'Without containers the job runs as you, with your files in reach. Only run workflows you trust.' : 'Publishing steps are removed, and no sign-in values are handed to the workflow.',
      go: () => this.setState({ stage: stage === 'ready' ? 'installing' : stage === 'installing' ? 'running' : 'ready' }) };
  }
}
</script>
</body>
</html>
