<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4ff3a}a:hover{color:#eaff8f}
@keyframes macpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes macrise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes macflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes macorb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.18)}}
@keyframes macorb2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,50px) scale(.9)}}
.mac-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
[data-motion="on"] .mac-orb{animation:macorb 14s ease-in-out infinite}
[data-motion="on"] .mac-orb + .mac-orb{animation:macorb2 18s ease-in-out infinite}
[data-motion="on"] section,[data-motion="on"] article,[data-motion="on"] aside,[data-motion="on"] [role="dialog"]{animation:macrise .8s cubic-bezier(.2,.9,.1,1) both}
[data-motion="on"] section:nth-of-type(2),[data-motion="on"] article:nth-of-type(2),[data-motion="on"] aside{animation-delay:.12s}
[data-motion="on"] article:nth-of-type(3){animation-delay:.24s}
[data-motion="on"] button,[data-motion="on"] a,[data-motion="on"] label{transition:transform .3s cubic-bezier(.2,.9,.1,1),filter .25s,background .25s,border-color .25s,box-shadow .3s}
[data-motion="on"] button:hover,[data-motion="on"] a:hover{transform:translateY(-2px);filter:brightness(1.08)}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@keyframes macpop{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes macink{from{transform:scaleX(.15)}to{transform:none}}
@keyframes macgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes macburst{from{opacity:1;transform:rotate(var(--a)) translateY(0)}to{opacity:0;transform:rotate(var(--a)) translateY(-260px) rotate(220deg)}}
@keyframes maclevel{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(2deg)}32%{transform:none}100%{opacity:1}}
@keyframes macring{0%,100%{box-shadow:0 0 0 4px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}50%{box-shadow:0 0 0 8px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}}
@keyframes macdash{to{stroke-dashoffset:-24}}
[data-motion="on"] .mac-pop{animation:macpop .45s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ink{animation:macink .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center}
[data-motion="on"] .mac-grow{animation:macgrow 1.1s cubic-bezier(.2,.9,.1,1) both;transform-origin:left}
[data-motion="on"] .mac-burst i{animation:macburst 1.6s cubic-bezier(.2,.9,.1,1) infinite}
[data-motion="on"] .mac-level{animation:maclevel 1.2s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ring{animation:macring 1.6s ease-in-out infinite}
[data-motion="on"] .mac-dash{animation:macdash 1s linear infinite}
[data-motion="on"] li{animation:macrise .6s cubic-bezier(.2,.9,.1,1) both}
</style>
</helmet>
<div data-motion="{{motionFlag}}" style="--acc: {{accent}}; isolation: isolate; width: 1440px; height: 900px; box-sizing: border-box; background: #0b0c10; color: #eef0f6; font-family: 'Bricolage Grotesque', system-ui, sans-serif; position: relative; overflow: hidden">
<div class="mac-orb" aria-hidden="true" style="width: 560px; height: 560px; left: -180px; top: -220px; background: {{accent}}; opacity: .14"></div><div class="mac-orb" aria-hidden="true" style="width: 480px; height: 480px; right: -160px; top: 120px; background: #b69cff; opacity: .16"></div>

<div style="padding: 20px; display: grid; grid-template-columns: {{cols}}; grid-template-rows: 1.25fr 1fr; gap: 8px; height: 100%; box-sizing: border-box">
  <section style="background: #12141b; border: 1px solid #2c3140; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; grid-row: 1 / 3"><div style="display: flex; border-bottom: 1px solid #2c3140; background: #0e1016"><span style="padding: 9px 14px; font: 600 13px 'Bricolage Grotesque', sans-serif; color: #eef0f6; background: #191c25; border-right: 1px solid #2c3140">Runs</span><span style="margin-left: auto; padding: 9px 12px; color: #8d93a8">⋮⋮</span></div>
    <ul style="list-style: none; margin: 0; padding: 8px; display: grid; gap: 6px"><sc-for list="{{runs}}" as="r" hint-placeholder-count="4"><li><button type="button" onClick="{{r.pick}}" style="width: 100%; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid {{r.border}}; background: {{r.bg}}; color: #eef0f6; font: inherit; display: grid; gap: 4px"><span style="display: flex; gap: 8px; align-items: center"><i class="{{r.pulse}}" style="width: 9px; height: 9px; border-radius: 50%; background: {{r.dot}}"></i><strong>{{r.title}}</strong></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d93a8">{{r.meta}}</span></button></li></sc-for></ul>
  </section>
  <section style="background: #12141b; border: 1px solid #2c3140; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0"><div style="display: flex; border-bottom: 1px solid #2c3140; background: #0e1016"><span style="padding: 9px 14px; font: 600 13px 'Bricolage Grotesque', sans-serif; color: #eef0f6; background: #191c25; border-right: 1px solid #2c3140">Live log</span><span style="padding: 9px 14px; font: 600 13px 'Bricolage Grotesque', sans-serif; color: #8d93a8; background: transparent; border-right: 1px solid #2c3140">Workflow</span><span style="margin-left: auto; padding: 9px 12px; color: #8d93a8">⋮⋮</span></div>
    <pre style="margin: 0; padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.7; color: #c9cede; white-space: pre-wrap; flex: 1; overflow: hidden">{{log}}<span style="display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: {{accent}}; animation: {{blink}}"></span></pre>
  </section>
  <section style="background: #12141b; border: 1px solid #2c3140; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0; display: {{sideDisplay}}; grid-row: 1 / 3"><div style="display: flex; border-bottom: 1px solid #2c3140; background: #0e1016"><span style="padding: 9px 14px; font: 600 13px 'Bricolage Grotesque', sans-serif; color: #eef0f6; background: #191c25; border-right: 1px solid #2c3140">Outputs</span><span style="padding: 9px 14px; font: 600 13px 'Bricolage Grotesque', sans-serif; color: #8d93a8; background: transparent; border-right: 1px solid #2c3140">Extensions</span><span style="margin-left: auto; padding: 9px 12px; color: #8d93a8">⋮⋮</span></div>
    <div style="padding: 12px; display: grid; gap: 8px"><sc-for list="{{outs}}" as="o" hint-placeholder-count="2"><div style="padding: 12px; border-radius: 12px; background: #191c25; display: grid; gap: 4px"><strong>{{o.name}}</strong><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d93a8">{{o.meta}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7cf5c8; overflow-wrap: anywhere">{{o.sum}}</span></div></sc-for>
    <div style="padding: 10px 12px; border-radius: 12px; border: 1px dashed #2c3140; color: #8d93a8; font-size: 13px">Drag a panel's tab to split, stack or float it. Layout is remembered.</div></div>
  </section>
  <section style="background: #12141b; border: 1px solid #2c3140; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; min-height: 0"><div style="display: flex; border-bottom: 1px solid #2c3140; background: #0e1016"><span style="padding: 9px 14px; font: 600 13px 'Bricolage Grotesque', sans-serif; color: #eef0f6; background: #191c25; border-right: 1px solid #2c3140">Where the time went</span><span style="margin-left: auto; padding: 9px 12px; color: #8d93a8">⋮⋮</span></div>
    <div style="padding: 14px 16px; display: grid; gap: 7px"><sc-for list="{{steps}}" as="s" hint-placeholder-count="6"><div style="display: grid; grid-template-columns: 150px 1fr 54px; gap: 10px; align-items: center; font-size: 12.5px"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span><span style="height: 14px; border-radius: 7px; background: #191c25; position: relative"><i class="mac-grow" style="{{s.bar}}"></i></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8d93a8; text-align: right">{{s.t}}</span></div></sc-for></div>
  </section>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#d4ff3a", "options": ["#d4ff3a", "#7cf5c8", "#b69cff", "#ff9e7a"], "section": "Look"}, "motion": {"editor": "boolean", "default": true, "section": "Look"}, "layout": {"editor": "select", "section": "Stage", "default": "three", "options": ["three", "two"]}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {

  constructor(p) { super(p); this.state = { sel: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#d4ff3a';
    const motion = this.props.motion ?? true;
    const layout = this.props.layout ?? 'three';
    const R = [['map-editor · build-installer.bat', 'running · windows-latest · 2m 14s', accent, true], ['docs-site · pages.yml', 'ready · 1 output · 48s', '#7cf5c8', false], ['api · Dockerfile', 'failed · step 3', '#ff7a6b', false], ['cli · build.sh', 'ready · 2 outputs · 1m 02s', '#7cf5c8', false]];
    const runs = R.map(([title, meta, dot, live], i) => ({ title, meta, dot, pulse: live && motion ? 'mac-ring-dot' : '', border: i === this.state.sel ? accent : '#2c3140', bg: i === this.state.sel ? 'rgba(212,255,58,.05)' : '#12141b', pick: () => this.setState({ sel: i }) }));
    const S = [['Set up job', 3, 0, '#8d93a8'], ['Open sources', 6, 3, '#b69cff'], ['Run build-installer.bat', 88, 9, accent], ['Seal outputs', 9, 97, '#b69cff'], ['Upload artifact', 12, 106, '#7cf5c8'], ['Complete job', 2, 118, '#8d93a8']];
    const total = 120;
    const steps = S.map(([name, d, at, c]) => ({ name, t: d + ' s', bar: 'position:absolute;top:0;bottom:0;border-radius:7px;left:' + (at / total * 100) + '%;width:' + Math.max(1.5, d / total * 100) + '%;background:' + c }));
    const logs = [
      '▸ Run build-installer.bat\n  restoring packages… done (14.2 s)\n  compiling 212 files\n  linking Setup.exe\n  packaging app-1.4.0-full.nupkg\n',
      '▸ Deploy rewritten: publishing steps removed\n  build finished in 41 s\n✓ uploaded site.zip\n',
      '▸ Step 3/7 : RUN npm ci\n  npm error code ERESOLVE\n✗ The build failed on step 3\n',
      '▸ Run build.sh\n  go build ./...\n✓ 2 outputs sealed and uploaded\n',
    ];
    const outs = this.state.sel === 2 ? [{ name: 'No outputs', meta: 'the run failed before upload', sum: '' }] : [{ name: 'Setup.exe', meta: '48.2 MB · decrypted', sum: 'sha256 9f2c…e1a0' }, { name: 'app-1.4.0-full.nupkg', meta: '46.9 MB · decrypted', sum: 'sha256 41bd…77c3' }];
    return { accent, motionFlag: motion ? 'on' : 'off', runs, steps, outs, log: logs[this.state.sel], blink: motion ? 'macpulse 1s steps(1) infinite' : 'none', cols: layout === 'three' ? '300px 1fr 320px' : '300px 1fr', sideDisplay: layout === 'three' ? 'flex' : 'none' };
  }
}
</script>
</body>
</html>
