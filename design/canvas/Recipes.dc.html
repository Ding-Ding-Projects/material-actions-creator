<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recipes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d4ff3a}a:hover{color:#eaff8f}
@keyframes macpulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes macrise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes macflow{from{background-position:0% 50%}to{background-position:200% 50%}}
@keyframes macorb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.18)}}
@keyframes macorb2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,50px) scale(.9)}}
.mac-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:-1}
[data-motion="on"] .mac-orb{animation:macorb 14s ease-in-out infinite}
[data-motion="on"] .mac-orb + .mac-orb{animation:macorb2 18s ease-in-out infinite}
[data-motion="on"] section,[data-motion="on"] article,[data-motion="on"] aside,[data-motion="on"] [role="dialog"]{animation:macrise .8s cubic-bezier(.2,.9,.1,1) both}
[data-motion="on"] section:nth-of-type(2),[data-motion="on"] article:nth-of-type(2),[data-motion="on"] aside{animation-delay:.12s}
[data-motion="on"] article:nth-of-type(3){animation-delay:.24s}
[data-motion="on"] button,[data-motion="on"] a,[data-motion="on"] label{transition:transform .3s cubic-bezier(.2,.9,.1,1),filter .25s,background .25s,border-color .25s,box-shadow .3s}
[data-motion="on"] button:hover,[data-motion="on"] a:hover{transform:translateY(-2px);filter:brightness(1.08)}
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@keyframes macpop{from{opacity:0;transform:scale(.9) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes macink{from{transform:scaleX(.15)}to{transform:none}}
@keyframes macgrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes macburst{from{opacity:1;transform:rotate(var(--a)) translateY(0)}to{opacity:0;transform:rotate(var(--a)) translateY(-260px) rotate(220deg)}}
@keyframes maclevel{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(2deg)}32%{transform:none}100%{opacity:1}}
@keyframes macring{0%,100%{box-shadow:0 0 0 4px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}50%{box-shadow:0 0 0 8px var(--acc),0 0 0 9999px rgba(5,6,9,.5)}}
@keyframes macdash{to{stroke-dashoffset:-24}}
[data-motion="on"] .mac-pop{animation:macpop .45s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ink{animation:macink .5s cubic-bezier(.34,1.56,.64,1) both;transform-origin:center}
[data-motion="on"] .mac-grow{animation:macgrow 1.1s cubic-bezier(.2,.9,.1,1) both;transform-origin:left}
[data-motion="on"] .mac-burst i{animation:macburst 1.6s cubic-bezier(.2,.9,.1,1) infinite}
[data-motion="on"] .mac-level{animation:maclevel 1.2s cubic-bezier(.34,1.56,.64,1) both}
[data-motion="on"] .mac-ring{animation:macring 1.6s ease-in-out infinite}
[data-motion="on"] .mac-dash{animation:macdash 1s linear infinite}
[data-motion="on"] li{animation:macrise .6s cubic-bezier(.2,.9,.1,1) both}
</style>
</helmet>
<div data-motion="{{motionFlag}}" style="--acc: {{accent}}; isolation: isolate; width: 1440px; height: 760px; box-sizing: border-box; background: #0b0c10; color: #eef0f6; font-family: 'Bricolage Grotesque', system-ui, sans-serif; position: relative; overflow: hidden">
<div class="mac-orb" aria-hidden="true" style="width: 560px; height: 560px; left: -180px; top: -220px; background: {{accent}}; opacity: .14"></div><div class="mac-orb" aria-hidden="true" style="width: 480px; height: 480px; right: -160px; top: 120px; background: #b69cff; opacity: .16"></div>

<div style="padding: 48px 56px; height: 100%; box-sizing: border-box">
  <p style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #8d93a8; margin: 0 0 10px">Recipes</p>
  <div style="display: flex; align-items: end; gap: 20px; margin-bottom: 22px"><h2 style="font-size: 52px; letter-spacing: -.04em; line-height: .95; margin: 0">Build it again. <span style="color: {{accent}}">One click.</span></h2><span style="margin-left: auto; padding: 14px 22px; border-radius: 20px; background: {{accent}}; color: #141a00; font-weight: 800">Save current form as recipe</span></div>
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px"><sc-for list="{{recipes}}" as="r" hint-placeholder-count="3"><article style="background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 20px; display: grid; gap: 10px; animation-delay: {{r.delay}}">
    <div style="display: flex; align-items: center; gap: 10px"><strong style="font-size: 20px">{{r.name}}</strong><span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 9px; border-radius: 99px; background: {{r.modeBg}}">{{r.mode}}</span></div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8d93a8">{{r.repo}}</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{r.chips}}" as="c" hint-placeholder-count="2"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 9px; border-radius: 99px; background: #232733">{{c}}</span></sc-for></div>
    <div style="padding: 10px 12px; border-radius: 12px; background: #0b0c10; font-size: 13px; color: #a7adc0"><span style="color: {{r.schedColor}}">●</span> {{r.sched}}<br><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{r.last}}</span></div>
    <div style="display: flex; gap: 8px"><button type="button" onClick="{{r.run}}" style="flex: 1; min-height: 46px; border: 0; border-radius: 14px; background: {{r.runBg}}; color: {{r.runColor}}; font: 800 15px 'Bricolage Grotesque', sans-serif">{{r.runLabel}}</button><span style="display: grid; place-items: center; width: 46px; border-radius: 14px; border: 1px solid #2c3140">⋯</span></div>
  </article></sc-for></div>
  <div style="display: {{emptyDisplay}}; background: #12141b; border: 1px solid #2c3140; border-radius: 22px; padding: 40px; text-align: center; color: #a7adc0">No recipes yet. Fill in the Workflows form once, then save it here.</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#d4ff3a", "options": ["#d4ff3a", "#7cf5c8", "#b69cff", "#ff9e7a"], "section": "Look"}, "motion": {"editor": "boolean", "default": true, "section": "Look"}, "stage": {"editor": "select", "section": "Stage", "default": "recipes", "options": ["recipes", "empty"]}, "$preview": {"width": 1440, "height": 760}}'>
class Component extends DCLogic {

  constructor(p) { super(p); this.state = { started: {} }; }
  renderVals() {
    const accent = this.props.accent ?? '#d4ff3a';
    const motion = this.props.motion ?? true;
    const empty = (this.props.stage ?? 'recipes') === 'empty';
    const R = [['Nightly installer', 'Ding-Ding-Projects/map-editor @ main', 'encrypted', ['build-installer.bat', 'windows-latest', 'dist/**'], 'Every day at 02:00', 'last: ready · 4m 12s · today 02:04', true], ['Docs preview', 'Ding-Ding-Projects/material-actions-creator @ main', 'private', ['pages.yml', 'ubuntu-latest'], 'Every 6 hours', 'last: ready · 48s · 08:00', true], ['Release candidate', 'Ding-Ding-Projects/api @ release', 'encrypted', ['all workflows', 'ubuntu-latest'], 'Only when you press Run', 'last: failed · step 3 · yesterday', false]];
    const recipes = empty ? [] : R.map(([name, repo, mode, chips, sched, last, on], i) => { const s = !!this.state.started[i]; return { name, repo, mode, chips, sched, last, delay: i * 80 + 'ms', modeBg: mode === 'encrypted' ? 'rgba(182,156,255,.2)' : '#232733', schedColor: on ? '#7cf5c8' : '#8d93a8', runLabel: s ? 'Started — see Runs' : 'Run now', runBg: s ? '#191c25' : accent, runColor: s ? '#a7adc0' : '#141a00', run: () => this.setState({ started: { ...this.state.started, [i]: true } }) }; });
    return { accent, motionFlag: motion ? 'on' : 'off', recipes, emptyDisplay: empty ? 'block' : 'none' };
  }
}
</script>
</body>
</html>
