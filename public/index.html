<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Material Actions Creator</title>
  <meta name="description" content="Material Actions Creator turns repository build scripts, workflows and Dockerfiles into temporary GitHub Actions runs and hands back the outputs.">
  <meta name="theme-color" content="#0b0c10">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/appearance.css">
  <link rel="stylesheet" href="/css/tools.css">
</head>
<body>
  <a class="skip" href="#views" data-i18n="skip">Skip to content</a>
  <div class="aurora" aria-hidden="true"></div>

  <header class="bar" data-ui="topbar">
    <a class="brand" href="/" data-ui="brand">
      <img src="/icon.svg" alt="" width="34" height="34" data-logo>
      <span class="brand-text"><span data-display-name>Material Actions Creator</span><small class="prov" data-provenance aria-live="polite">…</small></span>
    </a>
    <div class="bar-tools">
      <span class="conn" data-conn hidden></span>
      <button class="icon-btn" type="button" id="paletteBtn" data-ui="palette-btn" data-i18n-aria="menu.palette" aria-label="Command palette" aria-keyshortcuts="Control+Shift+F"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><kbd>Ctrl ⇧ F</kbd></button>
      <button class="icon-btn" type="button" id="notifyBtn" data-ui="notify-btn" data-i18n-aria="notify.center" aria-label="Notifications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="live-count" data-note-count hidden>0</span></button>
      <button class="account" id="accountBtn" type="button" aria-haspopup="dialog" data-ui="account">
        <span class="avatar" id="avatar"></span>
        <span class="account-text"><span id="accountName">Not signed in</span><span class="scope-dots" id="scopeDots"></span></span>
      </button>
    </div>
  </header>

  <nav class="tabstrip" id="tabstrip" aria-label="Pages" data-ui="tabstrip"></nav>

  <div class="recovery" id="recovery" role="status" hidden data-ui="recovery">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><strong id="recoveryTitle"></strong> <span id="recoveryBody"></span></div>
    <button class="btn quiet" type="button" id="recoveryView" data-i18n="recovery.view">View runs</button>
    <button class="icon-btn" type="button" id="recoveryDismiss" data-i18n-aria="common.close" aria-label="Close">×</button>
  </div>

  <div class="views" id="views" tabindex="-1"></div>

  <dialog id="authDialog" class="sheet" data-ui="auth-dialog">
    <form method="dialog" class="sheet-inner">
      <button class="close" value="close" data-i18n-aria="common.close" aria-label="Close">×</button>
      <p class="eyebrow">GitHub CLI</p>
      <h2 id="authTitle">Sign in</h2>
      <div id="authBody"></div>
    </form>
  </dialog>

  <dialog id="keyDialog" class="sheet" data-ui="key-dialog">
    <form class="sheet-inner" id="keyForm">
      <p class="eyebrow" data-i18n="key.eyebrow">Locked</p>
      <h2 data-i18n="key.title">Access key</h2>
      <p class="muted" data-i18n="key.body">This server is protected. Enter the access key set on the server.</p>
      <label class="field"><span data-i18n="key.label">Key</span><input id="keyInput" type="password" autocomplete="current-password" required></label>
      <div class="actions"><button class="fab small" type="submit" data-i18n="key.unlock">Unlock</button></div>
    </form>
  </dialog>

  <div class="dropzone" id="dropzone" hidden aria-hidden="true"><div><strong data-i18n="drop.title">Drop to apply your personal wording</strong><span data-i18n="drop.body">The file stays in this browser.</span></div></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript><p class="noscript">This app needs JavaScript.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
