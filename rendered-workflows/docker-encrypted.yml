name: Build Docker image
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: "custom-image:latest"
  PLATFORM: "linux/amd64"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out build context
        uses: actions/checkout@v4
      - name: Set up Node for mac-crypt
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Decrypt build context
        env:
          MAC_KEY: ${{ secrets.MAC_KEY }}
        run: node .mac/crypt.mjs open src.mac context
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build --platform "$PLATFORM" --tag "$IMAGE_NAME" \
            --file context/Dockerfile --output "type=docker,dest=image.tar" context
      - name: Compress image
        run: |
          gzip -1 image.tar
          ls -lh image.tar.gz
      - name: Encrypt outputs
        shell: bash
        env:
          MAC_KEY: ${{ secrets.MAC_KEY }}
        run: node .mac/crypt.mjs seal out.mac . "image.tar.gz"
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: mac-output
          path: |
            out.mac
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
