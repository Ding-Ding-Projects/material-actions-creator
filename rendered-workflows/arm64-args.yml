name: Build Docker image
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: "ghcr.io/acme/demo:1.2.3"
  PLATFORM: "linux/arm64"
  BUILD_ARG_0: "VERSION=1.0 \"quoted\""
  BUILD_ARG_1: "DEBUG=$(rm -rf /)"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out build context
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build --platform "$PLATFORM" --tag "$IMAGE_NAME" --build-arg "$BUILD_ARG_0" --build-arg "$BUILD_ARG_1" \
            --file context/Dockerfile --output "type=docker,dest=image.tar" context
      - name: Compress image
        run: |
          gzip -1 image.tar
          ls -lh image.tar.gz
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: mac-output
          path: |
            image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
